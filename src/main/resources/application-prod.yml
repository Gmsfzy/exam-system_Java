# ============================================================
# 生产环境配置
# 启动方式:
#   java -jar exam_system.jar --spring.profiles.active=prod,mssql
# 或:
#   set SPRING_PROFILES_ACTIVE=prod,mssql
# 必须通过环境变量注入: JWT_SECRET / MSSQL_USER / MSSQL_PASSWORD
# ============================================================
server:
  port: ${SERVER_PORT:8080}
  # 建议前置 Nginx 并终止 HTTPS；若直连可启用 SSL
  error:
    include-stacktrace: never
    include-message: never

spring:
  datasource:
    # mssql profile 提供主数据源；此处仅做 HikariCP 连接池调优
    hikari:
      pool-name: ExamHikariPool
      minimum-idle: 5
      maximum-pool-size: 20
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-test-query: SELECT 1
  jpa:
    # 生产环境禁止自动改表，只做校验；表结构由 DDL 脚本 / Flyway / Liquibase 管理
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss

app:
  jwt:
    # 无默认值，未配置则启动失败（由 JwtProvider 的长度校验兜底）
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  ai:
    base-url: ${AI_BASE_URL:https://ark.cn-beijing.volces.com/api/v3/chat/completions}
    api-key: ${DOUBAN_API_KEY:}
    model: ${AI_MODEL:doubao-seed-1-6-250615}
    connect-timeout-ms: 30000
    read-timeout-ms: 60000
    max-retries: 2
  cors:
    # 生产环境只允许正式前端域名，逗号分隔
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://exam.example.com}

# 生产环境关闭接口文档
springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false

logging:
  level:
    root: WARN
    com.exam.backend: INFO
    org.hibernate.SQL: WARN
  file:
    name: ${LOG_FILE:logs/exam-backend.log}
  logback:
    rollingpolicy:
      max-file-size: 50MB
      max-history: 30
      total-size-cap: 2GB

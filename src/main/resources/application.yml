spring:
  profiles:
    active: sqlite
  application:
    name: exam-backend
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

server:
  port: 8080

app:
  jwt:
    secret: ${JWT_SECRET:}
    expiration-ms: 86400000
  ai:
    base-url: https://ark.cn-beijing.volces.com/api/v3/chat/completions
    api-key: ${DOUBAN_API_KEY:}
    model: ${AI_MODEL:doubao-seed-1-6-250615}
    connect-timeout-ms: 30000
    read-timeout-ms: 60000
    max-retries: 2
  cors:
    allowed-origins: http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173
  swagger:
    open: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    com.exam.backend: INFO
    org.hibernate.SQL: WARN
    org.hibernate.orm.deprecation: WARN